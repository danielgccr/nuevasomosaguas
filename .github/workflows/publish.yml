name: Publicar el sitio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llegan dos push seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # index.qmd, politica_ia.qmd y biblioteca.qmd traen fragmentos de R
      # (refs.R cuenta las obras de la biblioteca), así que hace falta knitr.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar knitr y rmarkdown
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Renderizar
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
